<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardNET · Tokenización</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#d9dee5;--ac:#0b5cab;--ok:#16794c;--er:#b42318;--code:#eef1f5}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2028;--tx:#e6eaf0;--mut:#93a0b2;--bd:#2b3441;--ac:#5aa4ee;--ok:#4cc38a;--er:#f2766b;--code:#0e1217}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif;padding:20px}
main{max-width:1000px;margin:auto}
h1{font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h2{font-size:15px;margin:0 0 6px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
input,select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{margin-top:12px;margin-right:6px;padding:8px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:4px 10px;margin:0}
.hint{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{text-align:left;padding:5px 4px;border-bottom:1px solid var(--bd)}
pre{background:var(--code);border-radius:8px;padding:10px;margin:8px 0 0;overflow:auto;max-height:320px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{color:var(--ok)}.er{color:var(--er)}
code{background:var(--code);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<main>
<h1>CardNET · Customer → Captura de tarjeta → Activación → Compra</h1>

<div class="grid">
<section class="card">
<h2>1. Crear Customer</h2>
<label>Email *</label><input id="c_email" value="prueba001@gmail.com">
<div class="row"><div><label>Nombre</label><input id="c_fn"></div><div><label>Apellido</label><input id="c_ln"></div></div>
<button id="b_create">Crear Customer</button>
<label>CustomerId activo</label><input id="cid" placeholder="se llena al crear (o escribe uno existente)">
</section>

<section class="card">
<h2>2. Registrar tarjeta</h2>
<p class="hint">Pide un <code>UniqueID</code> nuevo al servidor y abre el iframe de CardNET. Al terminar, recarga los perfiles de pago.</p>
<button id="b_capture">Abrir formulario de captura</button>
<button id="b_profiles" class="sec">Recargar perfiles</button>
<table id="profiles"><tr><td class="hint">Sin perfiles cargados.</td></tr></table>
<form id="shoppingcart_form"><input type="hidden" id="PWToken" name="PWToken"></form>
</section>

<section class="card">
<h2>3. Activar token</h2>
<label>Token (PaymentProfile)</label><input id="a_tok" placeholder="CT__...">
<label>ActivationCode (llega en el microcargo de RD$1.00)</label><input id="a_code">
<button id="b_act">Activar</button>
</section>

<section class="card">
<h2>4. Compra</h2>
<label>TrxToken</label><input id="p_tok" placeholder="CT__...">
<div class="row"><div><label>Order</label><input id="p_ord"></div><div><label>Currency</label><input id="p_cur" value="DOP"></div></div>
<div class="row"><div><label>Amount (10000 = 100.00)</label><input id="p_amt" type="number" value="10000"></div><div><label>Tip</label><input id="p_tip" type="number" value="0"></div></div>
<div class="row"><div><label>Invoice</label><input id="p_inv" value="000021"></div><div><label>Tax</label><input id="p_tax" value="245"></div></div>
<div class="row"><div><label>CustomerIP</label><input id="p_ip" value="108.100.81.214"></div><div><label>Capture</label><select id="p_cap"><option value="true">true</option><option value="false">false</option></select></div></div>
<button id="b_buy">Pagar</button>
</section>

<section class="card full">
<h2>Log</h2>
<pre id="log">Listo.</pre>
</section>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const v = id => $(id).value.trim();
let cfg;

function log(title, status, data) {
  const cls = status && status < 400 ? 'ok' : 'er';
  $('log').innerHTML = `<span class="${status ? cls : ''}">${title}${status ? ' → HTTP ' + status : ''}</span>\n` +
    (data ? JSON.stringify(data, null, 2) : '');
}

async function api(method, url, body) {
  const r = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  log(`${method} ${url}`, r.status, j);
  return { ok: r.ok, j };
}

function newOrder() { $('p_ord').value = String(Date.now()).slice(-9); }

function needCustomer() {
  const id = v('cid');
  if (!id) alert('Primero crea o escribe un CustomerId.');
  return id;
}

// Cargar PWCheckout.js desde CardNET (debe venir de su URL pública)
async function init() {
  newOrder();
  cfg = await (await fetch('/api/config')).json();
  const s = document.createElement('script');
  s.src = cfg.scriptUrl;
  s.onload = () => {
    PWCheckout.Bind('tokenCreated', onTokenCreated);
    PWCheckout.SetProperties({
      name: 'Registro de tarjeta', description: 'Registro de medio de pago',
      'button-label': 'Guardar', currency: 'DOP', amount: '100', lang: 'ESP',
      form_id: 'shoppingcart_form', checkout_card: 1, autoSubmit: 'false', empty: 'true',
    });
  };
  s.onerror = () => log('No se pudo cargar PWCheckout.js', 0, { url: cfg.scriptUrl });
  document.head.appendChild(s);
}

// 1. Crear Customer
$('b_create').onclick = async () => {
  const body = { Email: v('c_email') };
  if (v('c_fn')) body.FirstName = v('c_fn');
  if (v('c_ln')) body.LastName = v('c_ln');
  const { j } = await api('POST', '/api/customers', body);
  if (j.Response && j.Response.CustomerId) $('cid').value = j.Response.CustomerId;
};

// 2. Captura: UniqueID nuevo en cada apertura
$('b_capture').onclick = async () => {
  const id = needCustomer(); if (!id) return;
  if (typeof PWCheckout === 'undefined') return alert('PWCheckout.js no cargó.');
  const { j } = await api('GET', `/api/customers/${encodeURIComponent(id)}`);
  const uid = j.Response && j.Response.UniqueID;
  if (!uid) return alert('El Customer no devolvió UniqueID. Revisa el log.');
  PWCheckout.OpenIframeCustom(`${cfg.captureUrl}?key=${cfg.publicKey}&session_id=${uid}`, uid);
};

function onTokenCreated(token) {
  log('tokenCreated', 200, token);
  loadProfiles();
}

async function loadProfiles() {
  const id = needCustomer(); if (!id) return;
  const { j } = await api('GET', `/api/customers/${encodeURIComponent(id)}`);
  const ps = (j.Response && j.Response.PaymentProfiles) || [];
  const t = $('profiles');
  if (!ps.length) { t.innerHTML = '<tr><td class="hint">Sin perfiles todavía.</td></tr>'; return; }
  t.innerHTML = '<tr><th>Tarjeta</th><th>Estado</th><th></th></tr>' + ps.map((p, i) =>
    `<tr><td>${p.Brand || ''} •••• ${p.Last4 || ''}</td>
     <td class="${p.Enabled ? 'ok' : 'er'}">${p.Enabled ? 'Activo' : 'Pendiente activación'}</td>
     <td><button class="sec" data-i="${i}">Usar</button></td></tr>`).join('');
  t.querySelectorAll('button').forEach(b => b.onclick = () => {
    const tok = ps[b.dataset.i].Token;
    $('a_tok').value = tok; $('p_tok').value = tok;
  });
}
$('b_profiles').onclick = loadProfiles;

// 3. Activación
$('b_act').onclick = async () => {
  const id = needCustomer(); if (!id) return;
  await api('POST', `/api/customers/${encodeURIComponent(id)}/activate`,
    { Token: v('a_tok'), ActivationCode: v('a_code') });
  loadProfilesQuiet();
};
async function loadProfilesQuiet() { /* refresca la tabla sin pisar el log de la activación */
  const id = v('cid'); if (!id) return;
  const r = await fetch(`/api/customers/${encodeURIComponent(id)}`);
  const j = await r.json().catch(() => ({}));
  const keep = $('log').innerHTML;
  const ps = (j.Response && j.Response.PaymentProfiles) || [];
  $('profiles').innerHTML = '<tr><th>Tarjeta</th><th>Estado</th></tr>' + ps.map(p =>
    `<tr><td>${p.Brand || ''} •••• ${p.Last4 || ''}</td><td class="${p.Enabled ? 'ok' : 'er'}">${p.Enabled ? 'Activo' : 'Pendiente activación'}</td></tr>`).join('');
  $('log').innerHTML = keep;
}

// 4. Compra
$('b_buy').onclick = async () => {
  await api('POST', '/api/purchase', {
    TrxToken: v('p_tok'), Order: v('p_ord'), Amount: v('p_amt'), Tip: v('p_tip'),
    Currency: v('p_cur'), Capture: v('p_cap'), CustomerIP: v('p_ip'),
    Invoice: v('p_inv'), Tax: v('p_tax'),
  });
  newOrder(); // el Order no se puede repetir (TR006)
};

init();
</script>
</body>
</html>
